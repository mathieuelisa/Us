name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Generates expo-env.d.ts and src/uniwind-types.d.ts (gitignored,
      # required for typecheck) as a side effect, and doubles as a build
      # smoke test. No Supabase credentials needed — the client falls back
      # to placeholder values when EXPO_PUBLIC_SUPABASE_* is unset.
      - run: npx expo export --platform web

      - run: npm run lint

      - run: npm run typecheck
